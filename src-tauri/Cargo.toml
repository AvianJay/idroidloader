[package]
name = "iloader"
version = "2.3.4"
description = "User-friendly sideloader"
authors = ["nab138"]
edition = "2024"

[workspace]
members = ["vendor/idevice"]
default-members = ["."]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "iloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
idevice = { version = "0.1.68", default-features = false, features = ["ring", "usbmuxd", "house_arrest", "afc", "core_device_proxy", "remote_pairing", "tcp", "tunnel_tcp_stack", "xpc", "rsd", "pair"] }
mdns-sd = "0.20"
socket2 = "0.6"
isideload = { version = "0.4.0", features = ["fs-storage"] } #, git = "https://github.com/nab138/isideload", package = "isideload", branch = "apple-codesign-quick" }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
tauri-plugin-store = "2"
futures = "0.3.31"
once_cell = "1.21.3"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tempfile = "3"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls-no-provider", "http2"] }
tokio = "1.49.0"
tauri-plugin-process = "2"
chrono = "0.4"
tracing-subscriber = "0.3.22"
tracing = "0.1.44"
tracing-appender = "0.2"
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
isideload-vfs = "0.0.1"
plist = "1.8.0"
plist-macro = "0.1.6"
tokio-util = "0.7.18"
rootcause = "0.12.1"
thiserror = "2.0.18"
strum = {version = "0.28.0", features = ["derive"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
rustls-platform-verifier = "=0.7.1"

[patch.crates-io]
# Android GrandSlam needs an explicit root store; platform-verifier cannot merge roots there.
isideload = { path = "vendor/isideload" }
idevice = { path = "vendor/idevice" }
