name: Android Builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 28.2.13676358
      IDROID_ANDROID_BUILD: ${{ github.run_number }}
      IDROID_UPDATE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'nightly' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358
          log-accepted-android-sdk-licenses: false

      - name: Configure Android environment
        shell: pwsh
        run: |
          $ndkPath = Join-Path $env:ANDROID_HOME "ndk/$env:NDK_VERSION"
          "NDK_HOME=$ndkPath" >> $env:GITHUB_ENV
          "KEYSTORE_FILE=$env:RUNNER_TEMP/idroidloader-signing.keystore" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android build files
        shell: pwsh
        run: |
          npm run tauri -- android init --ci --skip-targets-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # CLI 2.11 regenerates an older BuildTask; retain the checked-in Gradle 9 template.
          git restore --worktree -- src-tauri/gen/android

      - name: Check Android release publisher and updater metadata
        run: node --test tests/nightly-release.test.cjs tests/android-update.test.cjs

      - name: Check Anisette error reporting
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --package isideload --lib

      - name: Check wireless pairing transport
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --package idevice --no-default-features --features ring,remote_pairing --lib
          cargo test --locked --manifest-path src-tauri/Cargo.toml --package iloader --lib

      - name: Check mobile interface
        run: |
          npx playwright install chromium
          npm run test:ui

      - name: Restore signing keystore
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.repository == 'AvianJay/idroidloader'
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          foreach ($name in @('KEYSTORE_BASE64', 'KEYSTORE_ALIAS', 'KEYSTORE_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required signing secret: $name"
            }
          }
          try {
            [IO.File]::WriteAllBytes($env:KEYSTORE_FILE, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          } catch {
            throw 'Unable to decode KEYSTORE_BASE64 into a signing keystore.'
          }

      - name: Build signed release APK
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.repository == 'AvianJay/idroidloader'
        shell: pwsh
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          npm run tauri -- android build --target aarch64 --apk --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = 'src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination artifacts/iDroidLoader-arm64.apk
          $signer = Join-Path $env:ANDROID_HOME 'build-tools/36.0.0/apksigner.bat'
          & $signer verify --verbose artifacts/iDroidLoader-arm64.apk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash artifacts/iDroidLoader-arm64.apk -Algorithm SHA256).Hash.ToLower()
          Set-Content -LiteralPath artifacts/iDroidLoader-arm64.apk.sha256 -Encoding ascii -Value "$digest  iDroidLoader-arm64.apk"
          $aapt = Join-Path $env:ANDROID_HOME 'build-tools/36.0.0/aapt.exe'
          $badging = & $aapt dump badging artifacts/iDroidLoader-arm64.apk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $badging | Set-Content -LiteralPath artifacts/apk-badging.txt -Encoding utf8
          node .github/scripts/android-update.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build unsigned-test debug APK
        if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')) || github.repository != 'AvianJay/idroidloader'
        shell: pwsh
        run: |
          # Pull requests use Android's debug key and never receive release secrets.
          Remove-Item Env:KEYSTORE_FILE -ErrorAction SilentlyContinue
          powershell -ExecutionPolicy Bypass -File scripts/android.ps1 Build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check native updater policy
        working-directory: src-tauri/gen/android
        env:
          KEYSTORE_FILE: ""
        run: .\gradlew.bat :app:testUniversalDebugUnitTest -x :app:rustBuildUniversalDebug

      - name: Remove signing keystore
        if: always()
        shell: pwsh
        run: |
          if ($env:KEYSTORE_FILE -and (Test-Path -LiteralPath $env:KEYSTORE_FILE)) {
            Remove-Item -LiteralPath $env:KEYSTORE_FILE -Force
          }

      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ github.run_number }}
          path: |
            artifacts/*.apk*
            artifacts/android-update.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.repository == 'AvianJay/idroidloader'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: android-${{ github.run_number }}
          path: artifacts

      - name: Publish the selected update channel
        uses: actions/github-script@v9
        env:
          IDROID_ANDROID_BUILD: ${{ github.run_number }}
          IDROID_UPDATE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'nightly' }}
        with:
          script: |
            const publish = require('./.github/scripts/publish-android.cjs');
            await publish({ github, context, core });
