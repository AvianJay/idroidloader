<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body><div id="root"></div><script type="module">
import { mockIPC, mockWindows } from '/node_modules/@tauri-apps/api/mocks.js';
window.testCalls = [];
const credentialsTest = new URLSearchParams(location.search).has('credentials');
const wirelessTest = new URLSearchParams(location.search).has('wireless');
const updaterTest = new URLSearchParams(location.search).has('updater');
if (credentialsTest || wirelessTest || updaterTest) localStorage.setItem('i18nextLng', 'en');
const values = credentialsTest || updaterTest ? JSON.parse(localStorage.getItem('fixture-settings') || '{}') : {};
window.updateFixture = { release: { status: 'unavailable' }, nightly: { status: 'up_to_date' }, install: 'installer_opened', error: null, installError: null };
let loggedIn = null;
let wirelessRequest = null;
window.wirelessStatus = message => wirelessRequest?.channel.onmessage(message);
window.completeWireless = () => wirelessRequest?.resolve({ name: 'Wireless iPhone', id: 0, udid: 'fixture-wireless-udid', version: '27.0', connectionType: 'Wireless', address: '192.168.1.27' });
window.failWireless = () => wirelessRequest?.reject({ type: 'remote_pairing', message: 'Wireless pairing timed out' });
mockIPC((command, args) => {
  window.testCalls.push({ command, args });
  if (command === 'plugin:store|load') return 1;
  if (command === 'plugin:store|keys') return Object.keys(values);
  if (command === 'plugin:store|get') return [values[args.key] ?? null, args.key in values];
  if (command === 'plugin:store|set') { values[args.key] = args.value; return null; }
  if (command === 'plugin:store|save' && updaterTest) localStorage.setItem('fixture-settings', JSON.stringify(values));
  if (command === 'android_update_info') return { version: '2.3.4-nightly.1', versionCode: 100000001, channel: new URLSearchParams(location.search).get('buildChannel') || 'release' };
  if (command === 'check_android_update') {
    if (window.updateFixture.error) throw window.updateFixture.error;
    return window.updateFixture[args.channel];
  }
  if (command === 'install_android_update') {
    if (window.updateFixture.installError) throw window.updateFixture.installError;
    return { status: window.updateFixture.install };
  }
  if (command === 'plugin:app|version') return '2.3.4';
  if (command === 'keyring_available') return credentialsTest;
  if (command === 'logged_in_as') return loggedIn;
  if (command === 'login_new') {
    loggedIn = args.email;
    if (args.saveCredentials) {
      values.ids = [...new Set([...(values.ids || []), args.email])];
      localStorage.setItem('fixture-settings', JSON.stringify(values));
    }
  }
  if (command === 'login_stored') loggedIn = args.email;
  if (command === 'invalidate_account') loggedIn = null;
  if (command === 'delete_account') {
    values.ids = (values.ids || []).filter(id => id !== args.email);
    localStorage.setItem('fixture-settings', JSON.stringify(values));
  }
  if (command === 'plugin:dialog|open') return 'content://test-provider/pairing.plist';
  if (command === 'connect_network_device') {
    if (args.address === '192.168.1.99') throw { type: 'device_coms', message: 'Connection timed out' };
    return { name: 'Test iPhone', id: 0, udid: 'test-udid', version: '18.0', connectionType: 'Network', address: args.address };
  }
  if (command === 'pair_wireless_device') {
    return new Promise((resolve, reject) => { wirelessRequest = { requestId: args.requestId, channel: args.onStatus, resolve, reject }; });
  }
  if (command === 'cancel_pairing') wirelessRequest?.reject({ type: 'canceled', message: 'Wireless pairing canceled' });
  if (command === 'cancel_wireless_pairing' && wirelessRequest?.requestId === args.requestId) wirelessRequest.reject({ type: 'canceled', message: 'Wireless pairing canceled' });
  return null;
}, { shouldMockEvents: true });
mockWindows('main');
await import('/src/main.tsx');
</script></body></html>
